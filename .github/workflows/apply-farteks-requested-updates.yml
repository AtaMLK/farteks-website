name: Apply Farteks requested updates

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !startsWith(github.event.head_commit.message, 'Apply Farteks website requested updates') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source patch
        run: |
          base64 -d .farteks-update.patch.gz.b64 > /tmp/farteks.patch.gz
          gzip -dc /tmp/farteks.patch.gz > /tmp/farteks.patch
          git apply --whitespace=nowarn /tmp/farteks.patch
      - name: Build logos3.jpg
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          root=Path('.')
          out=Image.new('RGB',(1340,359),'white')
          def fit(path,w,h):
              im=Image.open(path).convert('RGBA'); im.thumbnail((w,h),Image.Resampling.LANCZOS); return im
          gdc=fit(root/'public/images/logos/gdc-logo.png',470,285)
          fz=fit(root/'public/images/logos/fz-logo.png',230,230)
          out.paste(gdc,(55,(359-gdc.height)//2),gdc)
          d=ImageDraw.Draw(out)
          for y in (112,166,220): d.polygon([(635,y),(696,y-48),(696,y-20),(635,y+28)],fill=(235,0,25))
          d.rectangle((731,76,739,275),fill=(24,24,28))
          try: font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf',52)
          except Exception: font=ImageFont.load_default()
          for text,y in [('Farteks',82),('Foreign',154),('Trade',226)]: d.text((772,y),text,font=font,fill=(24,24,28))
          out.paste(fz,(1070,(359-fz.height)//2),fz)
          Path('public/images/logos').mkdir(parents=True,exist_ok=True)
          out.save('public/images/logos/logos3.jpg','JPEG',quality=92,optimize=True)
          PY
      - name: Commit final changes
        run: |
          rm -f .farteks-update.patch.gz.b64 .farteks-logos3.jpg.b64 .github/workflows/apply-farteks-requested-updates.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Farteks website requested updates"
          git push origin main
